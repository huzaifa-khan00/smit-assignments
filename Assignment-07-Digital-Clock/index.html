<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="./assets/css/style.css" type="text/css">
</head>
<body>
    <div id="year-cont">
        <div id="am-pm">AM</div>
        <div id="year">2026</div>
        <div id="mil-seconds">000</div>
    <main>
    <div id="clock">
        <div id="week">
          <div id="">SUN</div>
          <div id="">MON</div>
          <div id="">TUE</div>
          <div id="">WED</div>
          <div id="">THU</div>
          <div id="">FRI</div>
          <div id="">SAT</div>
        </div>
        <div id="hours" class="time-hour">12</div>
        <div id="dot" class="time-dot">:</div>
        <div id="minutes" class="time-minutes">00</div>
        <div id="dot" class="time-dot">:</div>
        <div id="seconds" class="time-seconds">00</div>
    </div>
        <div id="clock2">
        <div id="week">
          <div id="sun">SUN</div>
          <div id="mon">MON</div>
          <div id="tue">TUE</div>
          <div id="wed">WED</div>
          <div id="thu">THU</div>
          <div id="fri">FRI</div>
          <div id="sat">SAT</div>
        </div>
        <div id="hours2" class="time-hour">12</div>
        <div id="dot" class="time-dot">:</div>
        <div id="minutes2" class="time-minutes">00</div>
        <div id="dot" class="time-dot">:</div>
        <div id="seconds2" class="time-seconds">00</div>
    </div>
    </main>
    <script src="./assets/js/main.js"></script>
</body>
</html>
