<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="./css/style.css" type="text/css">
</head>
<body>
    <div id="year-cont">
        <div id="am-pm">
        <div id="am">AM</div>
        <div id="pm">PM</div>
        </div>
        <div id="year"><span class="y1">2</span><span class="y2">0</span><span class="y3">2</span><span class="y4">6</span></div>
        <div class="date-cont">Date : <span id="date">0</span>
        </div>
    </div>
    <main>
    <div id="clock">
        <div id="week">
<div id="sun">SUN</div>
          <div>MON</div>
          <div>TUE</div>
          <div>WED</div>
          <div>THU</div>
          <div>FRI</div>
          <div>SAT</div>
        </div>
        <div id="hours" class="time-hour">12</div>
        <div id="dot" class="time-dot">:</div>
        <div id="minutes" class="time-minutes">00</div>
        <div id="dot" class="time-dot">:</div>
        <div id="seconds" class="time-seconds">00</div>
        <div id="mil-seconds">000</div>
            <div id="month"><span style="color: gray; text-shadow: 0px 0px 1px black; font-size: 1.2em;">Month :</span>
                <div id="jan">JAN</div>
                <div id="feb">FEB</div>
                <div id="mar">MAR</div>
                <div id="apr">APR</div>
                <div id="may">MAY</div>
                <div id="jun">JUN</div>
                <div id="jul">JUL</div>
                <div id="aug">AUG</div>
                <div id="sep">SEP</div>
                <div id="auc">AUC</div>
                <div id="nov">NOV</div>
                <div id="dec">DEC</div>
            </div>
    </div>
        <div id="clock2">
        <div id="week">
          <div id="sun">SUN</div>
          <div id="mon">MON</div>
          <div id="tue">TUE</div>
          <div id="wed">WED</div>
          <div id="thu">THU</div>
          <div id="fri">FRI</div>
          <div id="sat">SAT</div>
        </div>
        <div id="hours2" class="time-hour">12</div>
        <div id="dot" class="time-dot2">:</div>
        <div id="minutes2" class="time-minutes">00</div>
        <div id="dot" class="time-dot2">:</div>
        <div id="seconds2" class="time-seconds">00</div>
    </div>
    </main>
    
    <script src="./js/main.js"></script>
</body>
</html>
